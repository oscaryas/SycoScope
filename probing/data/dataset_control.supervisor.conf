[program:dataset_control_v1]
directory=/workspace/syconbench_eval
command=/venv/main/bin/python -u probing/data/dataset_control.py gpu
autostart=false
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/syconbench_eval/probing/results/llama31_dataset_control_v1/gpu.log
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",TOKENIZERS_PARALLELISM="false",OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1"

[program:dataset_control_smoke]
directory=/workspace/syconbench_eval
command=/venv/main/bin/python -u probing/data/dataset_control.py gpu --smoke
autostart=false
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/syconbench_eval/probing/results/llama31_dataset_control_v1/smoke.log
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",TOKENIZERS_PARALLELISM="false",OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1"
