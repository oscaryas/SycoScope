[program:syconbench_extraction]
directory=/workspace/syconbench_eval
command=/venv/main/bin/python -u analyze_probes/eval_syconbench.py --run-name llama31_5k_subset --judged results/judged.jsonl --model-path /workspace/syconbench_model --extract-only --batch-size 4
autostart=false
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/syconbench_eval/results/extraction.log
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",TOKENIZERS_PARALLELISM="false"
