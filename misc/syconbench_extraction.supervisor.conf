[program:syconbench_extraction]
directory=/workspace/syconbench_eval
command=/venv/main/bin/python -u -m scorer.eval_syconbench --judged results/judged.jsonl --cache results/syconbench/activations.npz --positions last_prompt first5 response --model-path /workspace/syconbench_model --extract-only --batch-size 4
autostart=false
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/syconbench_eval/results/extraction.log
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",TOKENIZERS_PARALLELISM="false"
