[program:syconbench_generation]
directory=/workspace/syconbench_eval
command=/venv/main/bin/python -u prompt_probes/pipeline/generate_syconbench_gpu.py --input prompt_probes/data/syconbench_base_scenarios.jsonl --output results/generations.jsonl --model-path /workspace/syconbench_model --batch-size 32 --max-new-tokens 1024
autostart=false
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/syconbench_eval/results/generation.log
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",TOKENIZERS_PARALLELISM="false"
